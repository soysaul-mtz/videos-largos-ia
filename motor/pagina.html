<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #escena { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  .capa { position: absolute; inset: 0; overflow: hidden; }
  /* orden: fondo < video < piezas "detrás" < persona recortada < piezas < (video encima) < subtítulos < encima */
  .fondo { z-index: 0; } .detras { z-index: 2; } .piezas { z-index: 4; } .subs { z-index: 6; pointer-events: none; } .encima { z-index: 7; pointer-events: none; }
  .vid { position: absolute; overflow: hidden; z-index: 1; } .vid.frente { z-index: 3; }
  .vid img, .vid .sinvideo { position: absolute; display: block; max-width: none; }
  .vid .sinvideo svg { width: 100%; height: 100%; display: block; }
  .pieza { position: absolute; inset: 0; }
  * { box-sizing: border-box; }
</style>
<link rel="stylesheet" href="/estilo/estilo.css">
</head><body><div id="escena"></div>
<script type="module" src="/motor/nucleo.js"></script>
</body></html>
